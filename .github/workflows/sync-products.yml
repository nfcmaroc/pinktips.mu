# Rebuilds the product pages and sitemap from the Google Sheet, so new or changed products
# get their /p/<slug>/ page (the Merchant Center feed links to these) without anyone running a script.
name: Sync products from the sheet
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # or run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
concurrency: sync-products
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_pages.py && python build.py
      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "pinktips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: rebuild product pages from the sheet"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
